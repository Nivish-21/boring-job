<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Career-Ops review queue</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="product-name">Career-Ops</p>
          <h1>Job listings</h1>
          <p class="lede">Every job the pipeline has scraped and evaluated. Review evidence and drafts before a supervised next step.</p>
        </div>
        <button class="button button-secondary" id="refresh" type="button">Refresh</button>
      </header>
      <p class="notice">Approval records a decision only. This dashboard never submits an application or sends a message.</p>
      <section id="usage" class="usage" aria-live="polite" hidden></section>
      <div class="layout">
        <aside class="sidebar">
          <h2>Filters</h2>
          <fieldset class="filter-group">
            <legend>Status</legend>
            <label><input type="checkbox" name="status" value="pending" checked> Pending review</label>
            <label><input type="checkbox" name="status" value="approved"> Approved</label>
            <label><input type="checkbox" name="status" value="rejected"> Rejected</label>
            <label><input type="checkbox" name="status" value="skipped"> Skipped (not a fit)</label>
            <label><input type="checkbox" name="status" value="daily_cap_reached"> Waiting for cap</label>
            <label><input type="checkbox" name="status" value="unverified"> Couldn't verify</label>
            <label><input type="checkbox" name="status" value="expired"> Expired / closed</label>
            <label><input type="checkbox" name="status" value="aggregator_rejected"> Rejected (bad source)</label>
          </fieldset>
          <div class="filter-group">
            <label for="filter-company">Company</label>
            <input type="search" id="filter-company" placeholder="Search company…">
          </div>
          <div class="filter-group">
            <label for="filter-fit-min">Minimum fit score</label>
            <input type="number" id="filter-fit-min" min="0" max="10" placeholder="0">
          </div>
          <button class="button button-secondary" id="clear-filters" type="button">Clear filters</button>
        </aside>
        <section class="results">
          <p class="result-count" id="result-count"></p>
          <section id="listings" class="queue" aria-live="polite" aria-busy="true"></section>
        </section>
      </div>
    </main>
    <template id="item-template">
      <article class="review-item">
        <div class="item-heading">
          <div>
            <p class="item-meta"></p>
            <h2></h2>
          </div>
          <div class="badges">
            <span class="kind"></span>
            <span class="status"></span>
          </div>
        </div>
        <p class="summary"></p>
        <dl class="details"></dl>
        <section class="draft-wrap" hidden>
          <h3>Generated draft</h3>
          <pre class="draft"></pre>
        </section>
        <section class="evidence-wrap" hidden>
          <h3>Evidence</h3>
          <ul class="evidence"></ul>
        </section>
        <div class="actions">
          <a class="button button-secondary source-link" target="_blank" rel="noreferrer">Open source</a>
          <a class="button button-secondary artifact-link" target="_blank" rel="noreferrer" hidden>Open artifact</a>
          <a class="button button-secondary website-link" target="_blank" rel="noreferrer" hidden>Company website</a>
          <a class="button button-secondary linkedin-link" target="_blank" rel="noreferrer" hidden>Company LinkedIn</a>
          <button class="button button-primary" data-action="approve" type="button" hidden>Approve</button>
          <button class="button button-secondary" data-action="regenerate" type="button" hidden>Regenerate</button>
          <button class="button button-danger" data-action="reject" type="button" hidden>Reject</button>
        </div>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
