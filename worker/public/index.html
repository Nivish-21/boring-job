<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Career-Ops review queue</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="product-name">Career-Ops</p>
          <h1>Review queue</h1>
          <p class="lede">Review evidence and drafts before a supervised next step.</p>
        </div>
        <button class="button button-secondary" id="refresh" type="button">Refresh queue</button>
      </header>
      <p class="notice">Approval records a decision only. This dashboard never submits an application or sends a message.</p>
      <section id="usage" class="usage" aria-live="polite" hidden></section>
      <section id="queue" class="queue" aria-live="polite" aria-busy="true"></section>
    </main>
    <template id="item-template">
      <article class="review-item">
        <div class="item-heading">
          <div>
            <p class="item-meta"></p>
            <h2></h2>
          </div>
          <span class="status"></span>
        </div>
        <p class="summary"></p>
        <dl class="details"></dl>
        <section class="draft-wrap" hidden>
          <h3>Generated draft</h3>
          <pre class="draft"></pre>
        </section>
        <section class="evidence-wrap" hidden>
          <h3>Evidence</h3>
          <ul class="evidence"></ul>
        </section>
        <div class="actions">
          <a class="button button-secondary source-link" target="_blank" rel="noreferrer">Open source</a>
          <a class="button button-secondary artifact-link" target="_blank" rel="noreferrer" hidden>Open artifact</a>
          <button class="button button-primary" data-action="approve" type="button">Approve</button>
          <button class="button button-secondary" data-action="regenerate" type="button">Regenerate</button>
          <button class="button button-danger" data-action="reject" type="button">Reject</button>
        </div>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
