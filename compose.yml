services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKER_PORT:-8080}:8080"
    environment:
      PORT: 8080
      ARTIFACT_DIR: /app/artifacts
      REVIEW_DATA_DIR: /app/data
      REVIEW_AUTH_USER: ${REVIEW_AUTH_USER:-}
      REVIEW_AUTH_PASSWORD: ${REVIEW_AUTH_PASSWORD:-}
      RESUME_DIR: /app/resumes
      DISCOVERY_QUERY: ${DISCOVERY_QUERY:-}
      DAILY_LEAD_CAP: ${DAILY_LEAD_CAP:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
    volumes:
      - ./data/artifacts:/app/artifacts
      - ./data/review:/app/data
      - ${RESUME_HOST_DIR:-/Users/nivish/Desktop/Nivish_Tailored_Resumes}:/app/resumes:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      NODE_ENV: production
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/artifacts:/files
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
